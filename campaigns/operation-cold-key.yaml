id: operation-cold-key
title: "Operation Cold Key"
persona: "GLACIAL"
tagline: "They were never after your code. They were after your cloud."
description: "A credential-focused campaign. GLACIAL does not deface anything - they harvest tokens, move through your build and registry infrastructure, and settle into your cloud account. Every chapter maps to a lab with a cloud (Floci) track."
chapters:
  - scenario: "06"
    beat: "Credential harvest"
    narrative: "It starts with a worm that steals publish tokens and CI secrets, then republishes itself under the victim's identity. GLACIAL's first move is to become someone you trust."
  - scenario: "14"
    beat: "Image poisoning"
    narrative: "With registry access in hand, the actor tampers with a container image your whole fleet pulls. One poisoned base layer and every deploy carries them along."
  - scenario: "17"
    beat: "The full chain"
    narrative: "Now the moves chain: a poisoned package reaches the build, the build reaches the registry, the registry reaches production. Watch one capture turn into many."
  - scenario: "21"
    beat: "The trusted release"
    narrative: "The endgame is quiet: a familiar package ships a compromised release, and the tokens it steals open the cloud account itself. By the time anyone reads the diff, GLACIAL is already inside."
debrief: "Every stage looked routine in isolation. That is what makes credential campaigns so expensive - there is no single alarm, only a trail you reconstruct afterward. The controls you practiced (token hygiene, image provenance, tree-wide scanning, release verification) are the trail-cutters."
