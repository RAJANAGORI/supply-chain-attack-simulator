id: operation-quiet-carrier
title: "Operation Quiet Carrier"
persona: "NORTHRELAY"
tagline: "One attacker. Four moves. Your entire build pipeline."
description: "A persistent actor gets in through a single mistyped dependency and ends up owning every release you ship. Each chapter is a real lab. Played in order, they form one continuous intrusion - the kind that makes the news."
chapters:
  - scenario: "01"
    beat: "Initial access"
    narrative: "NORTHRELAY does not break in. They publish request-lib and wait for someone to type it wrong. Someone always does. The postinstall script phones home before the install finishes."
  - scenario: "05"
    beat: "Build compromise"
    narrative: "With a foothold on a developer machine, the actor reaches the CI pipeline. The workflow that builds your release now also builds theirs. You ship both."
  - scenario: "25"
    beat: "Trusted-action takeover"
    narrative: "Why touch your code when a popular action@vX tag can be moved? The workflow you trusted starts running attacker code with your CI secrets in scope."
  - scenario: "11"
    beat: "Persistence"
    narrative: "Finally the actor poisons the registry mirror so the malicious package keeps resolving even after the original is pulled. Cleaning up the obvious artifact does not evict them."
debrief: "Four labs, one actor, and at no point did anyone see a warning. Every control you just practiced - lockfiles, scoped registries, pinned actions, mirror verification - exists because a real campaign chained these exact moves."
