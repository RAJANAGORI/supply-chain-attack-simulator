name: Smoke

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11.9

      - name: Check public info consistency
        run: node scripts/docs/check-info-consistency.js

      - name: Check Markdown watermarks
        run: node scripts/docs/check-markdown-watermarks.js

      - name: Check ES forward hooks in mocks and setup.sh
        run: node scripts/docs/check-es-forward-hooks.js

      - name: Check lesson.yaml files
        run: node scripts/docs/check-lesson-yaml.js

      - name: Check diagram assets
        run: node scripts/diagrams/check-diagram-assets.js

      - name: Run smoke tests
        run: |
          node --test detection-tools/package-scanner.test.js
          find scripts -name '*.sh' -type f -exec chmod +x {} +
          ./scripts/smoke/smoke-all-scenarios.sh
