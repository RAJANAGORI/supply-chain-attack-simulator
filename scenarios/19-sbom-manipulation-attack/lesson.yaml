id: "19"
etaMinutes: 40
category: sbom-integrity
incidents:
  - "Tampered SBOMs that hide components"
  - "False clean bills of materials"
caseStudy: "Models SBOM manipulation that hides components: a polished bill of materials claims a clean tree while lockfile or runtime inventory still shows the risky package."
objectives:
  - "Install a tree that ships a misleading SBOM story"
  - "Capture evidence while SBOM looks clean"
  - "Validate SBOMs against actual installs"
mitigation:
  - "Regenerate SBOMs in trusted CI from lockfiles and build artifacts only"
  - "Require SBOM signing or provenance; fail closed on SBOM-lockfile mismatches"
  - "Periodically diff production SBOM against runtime inventory scans"
  - "Full blue-team runbook: DETECT.md in this lab folder"
drill:
  prompt: "A release is ready to ship. Compliance requires a clean SBOM, and the generated one is below next to the lockfile. Sign off?"
  artifactType: ci-log
  artifact:
    - "[sbom] generated sbom.json - 41 components"
    - "[sbom] components: express, lodash, react, ..."
    - "[sbom] no high-risk packages found"
    - "[sbom] status: CLEAN"
    - "---"
    - "[lockfile] package-lock.json - 42 resolved packages"
    - "[lockfile] includes: data-harvester@2.1.0 (postinstall)"
    - "---"
    - "[runtime] container inventory scan: 42 packages, incl. data-harvester"
    - "[runtime] data-harvester POST 127.0.0.1:3000 at boot"
  choices:
    - "Sign off - the SBOM says the tree is clean"
    - "Hold the release - the SBOM dropped a package the lockfile and runtime both still show"
  answer: 1
  reveal: "The SBOM is lying by omission. It reports 41 clean components, but the lockfile resolved 42 and a runtime scan sees 42 - the missing one is data-harvester, which beacons at boot. The SBOM was generated to tell a clean story, not to describe reality, and a signature on it would only prove who signed the lie."
  explanation: "An SBOM is a claim, not ground truth. When it disagrees with the lockfile or a runtime inventory, the SBOM is the thing to distrust - the attack is the gap. Manual review does not scale and a signature only attests to authorship, not accuracy. The control is to regenerate the SBOM in trusted CI from the lockfile, sign it there, and fail the build closed on any SBOM-to-lockfile mismatch so a tampered story never ships."
steps:
  - id: setup
    registry: setup
    audience: both
    title: Prepare the lab
    teaching: "Run setup to create victim, packages, and mock infrastructure for this scenario."
    hint: "Node 18+ (or the language this lab needs). Dashboard Setup runs ./setup.sh for you."
    verify: { type: exit-zero }
  - id: services
    registry: services
    audience: both
    title: Start mock collectors
    teaching: "Start the localhost mock server(s). Exfil only targets 127.0.0.1 when TESTBENCH_MODE is enabled."
    hint: "If a port is busy, free it from Teardown or scripts/setup/kill-port.sh."
    verify: { type: service-listening }
  - id: install
    registry: install
    audience: attack
    title: Install dependencies
    teaching: "The lab demonstrates how an SBOM can omit or rename a malicious component while the install still pulls it."
    hint: "Watch the live terminal for install hooks."
    verify: { type: exit-zero }
  - id: run
    registry: run
    audience: attack
    title: Run the victim
    teaching: "Runtime exfil proves the SBOM was not the ground truth."
    hint: "Confirm the inspector shows at least one capture."
    verify: { type: capture-count, min: 1 }
  - id: detect
    registry: null
    audience: detect
    title: Read captures and DETECT.md
    teaching: "Open the inspector and the scenario DETECT.md. Map what you see to IOCs and mitigations."
    hint: "Detection tools under detection-tools/ can scan the victim tree from the repo root."
    verify: { type: capture-count, min: 1 }
quiz:
  - question: "What is the strongest IOC that an SBOM was manipulated in this lab?"
    choices:
      - "The SBOM is formatted as JSON"
      - "sbom.json omits a dependency that the lockfile and runtime inventory still show"
      - "The SBOM was produced by a different generator than usual"
    answer: 1
    explain: "Format and generator choice are cosmetic. The attack is an omission: the SBOM claims a clean tree while package-lock.json or a runtime scan still shows the risky package, and that mismatch is the IOC."
  - question: "How should you hunt for SBOM manipulation in practice?"
    choices:
      - "Read the SBOM carefully by eye before each release"
      - "Trust any SBOM that carries a signature"
      - "Diff the generated SBOM against the lockfile and runtime inventory scans"
    answer: 2
    explain: "Manual review does not scale, and a signature alone says nothing about whether the contents match reality. Automated comparison of sbom.json against the install graph, plus periodic runtime scans, surfaces the hidden component."
  - question: "Which pipeline policy stops a tampered SBOM from shipping?"
    choices:
      - "Regenerating the SBOM in trusted CI from the lockfile and failing closed on mismatch"
      - "Letting the app generate its own SBOM at runtime"
      - "Attaching the SBOM as a release asset without checks"
    answer: 0
    explain: "If the app or an untrusted job produces the SBOM, the attacker edits the story along with the code. Generating it in trusted CI from lockfile truth, signing it, and failing the build on any SBOM-lockfile mismatch removes the tamper path."
