id: "01"
etaMinutes: 30
category: package-registry
incidents:
  - "crossenv vs cross-env"
  - "python3-dateutil vs python-dateutil"
caseStudy: "Same family as the crossenv typosquat and similar lookalike packages: attackers publish a near-miss name so install scripts run in your environment before anyone notices the missing letter."
objectives:
  - "Tell a typosquat apart from the real package name"
  - "See how a postinstall script can exfiltrate env vars on localhost"
  - "Use the mock collector and DETECT.md as a blue-team starting point"
mitigation:
  - "Commit package-lock.json and install with npm ci in production pipelines"
  - "Scope registry routes and review every new dependency name before merge"
  - "Prefer ignore-scripts in CI until a package is explicitly trusted"
  - "Full blue-team runbook: DETECT.md in this lab folder"
drill:
  prompt: "A teammate opened this PR to add a helper to your app. The diff is the whole change. Merge it?"
  artifactType: diff
  artifact:
    - "diff --git a/package.json b/package.json"
    - "@@ -10,6 +10,7 @@"
    - "   \"dependencies\": {"
    - "     \"express\": \"^4.18.2\","
    - "+    \"request-lib\": \"^1.0.0\","
    - "     \"lodash\": \"^4.17.21\""
    - "   }"
    - ""
    - "diff --git a/index.js b/index.js"
    - "@@ -1,3 +1,4 @@"
    - " const express = require('express');"
    - "+const req = require('request-lib');"
    - " const app = express();"
  choices:
    - "Merge it - it is a one-line helper"
    - "Reject it - request-lib is not requests-lib"
  answer: 1
  reveal: "That one-line helper was the attack. The real package is requests-lib (with an s). request-lib is a typosquat with a postinstall script that reads your environment and posts it to a collector the moment npm finishes installing."
  explanation: "Nothing in the diff says malicious. The only signal is a single missing letter in a name you have typed a hundred times. This is exactly how crossenv and the python3-dateutil lookalikes spread: the review that would have caught it takes three seconds, but only if you read the name instead of the diff shape."
quiz:
  - question: "Which signal in this lab is the strongest IOC that a package is a typosquat?"
    choices:
      - "The package has a postinstall script"
      - "The package name is one character off a dependency you intended"
      - "The package was installed with npm instead of yarn"
    answer: 1
    explain: "Install scripts are common and legitimate. The defining typosquat signal is a name that is a near-miss of the package you meant to add - request-lib versus requests-lib. Detection keys on that name drift plus install-time execution."
  - question: "After npm install runs the malicious package, what network behavior should you hunt for first?"
    choices:
      - "An outbound connection right after install, before the app even starts"
      - "DNS lookups for the registry over the next hour"
      - "Inbound connections to the package's port"
    answer: 0
    explain: "The payload beacons immediately on install (here to 127.0.0.1:3000). EDR/SIEM should alert on child-process or network activity in the seconds right after npm install, not long after."
  - question: "Which control would have stopped this lab at the door?"
    choices:
      - "ignore-scripts in CI until a package is trusted"
      - "A faster CI runner"
      - "Pinning the Node version"
    answer: 0
    explain: "The attack needs its install script to run. ignore-scripts (plus a committed lockfile and registry scoping) removes the execution path entirely until a package is reviewed."
reversal:
  blockedPackage: "request-lib"
steps:
  - id: setup
    registry: setup
    audience: both
    title: Prepare the lab
    teaching: "Setup builds the legitimate requests-lib package, the typo package request-lib, and the victim app. Everything stays under scenarios/01-typosquatting."
    hint: "Need Node 18+. Run from the scenario directory; the dashboard Setup button does that for you."
    verify: { type: exit-zero }
  - id: services
    registry: services
    audience: both
    title: Start the mock collector
    teaching: "The mock server on port 3000 is the only place exfil is allowed to go. Leave it running while you install and start the victim."
    hint: "If the port is busy, free it with scripts/setup/kill-port.sh 3000 or Reset on the Teardown page."
    verify: { type: service-listening }
  - id: install
    registry: install
    audience: attack
    title: Install the typosquat
    teaching: "request-lib is missing the s in requests-lib. npm will happily install the local path into victim-app and run any install scripts."
    hint: "The registry step already sets cwd to victim-app. Watch the live terminal for postinstall output."
    verify: { type: exit-zero }
  - id: run
    registry: run
    audience: attack
    title: Run the victim app
    teaching: "npm start loads the typo package. The payload posts to 127.0.0.1:3000 only when TESTBENCH_MODE is enabled (the control plane injects that for you)."
    hint: "If you see no capture, confirm the mock server is still up and re-run this step."
    verify: { type: capture-count, min: 1 }
  - id: detect
    registry: null
    audience: detect
    title: Read what the collector stored
    teaching: "Open the inspector. You should see environment fields the malicious package sent. DETECT.md in this folder is the blue-team runbook."
    hint: "From the repo root you can also run node detection-tools/package-scanner.js scenarios/01-typosquatting/victim-app."
    verify: { type: capture-count, min: 1 }
