id: "15"
etaMinutes: 40
category: developer-tools
incidents:
  - "Malicious CLI/dev tools on the PATH"
  - "Trusted toolchain abuse"
caseStudy: "Models malicious developer CLI tools on the PATH: a trusted toolchain install runs lifecycle scripts and can plant persistence or exfiltrate secrets from the workstation."
objectives:
  - "Run a victim that loads a malicious developer tool"
  - "See exfil from tooling rather than app deps"
  - "Lock down tool install sources"
mitigation:
  - "Install dev tools with --ignore-scripts by default from approved registries only"
  - "Pin tool versions and verify checksums before distributing to developers"
  - "Review lockfile and ignore-file diffs after any toolchain install"
  - "Full blue-team runbook: DETECT.md in this lab folder"
steps:
  - id: setup
    registry: setup
    audience: both
    title: Prepare legitimate and malicious tools
    teaching: "Setup places legitimate and malicious dev-tool trees and wires the victim to use the bad one in the attack path."
    verify: { type: exit-zero }
  - id: services
    registry: services
    audience: both
    title: Start the mock collector
    teaching: "The malicious tool posts to localhost:3015."
    verify: { type: service-listening }
  - id: install
    registry: install
    audience: attack
    title: Install the malicious developer tool
    teaching: "npm install pulls file:../dev-tools/malicious-dev-tool into victim-app. postinstall posts to the mock collector when TESTBENCH_MODE is enabled."
    hint: "Keep mock :3015 running. Watch Live Output for the postinstall hook."
    verify: { type: capture-count, min: 1 }
  - id: run
    registry: run
    audience: attack
    title: Run victim with malicious tool
    teaching: "npm start requires('dev-tool') and calls run(). Capture already landed during install."
    hint: "If MODULE_NOT_FOUND, re-run the install step first."
    verify: { type: exit-zero }
  - id: detect
    registry: null
    audience: detect
    title: Trust but verify tooling
    teaching: "Compare legitimate-dev-tool vs malicious-dev-tool. DETECT.md focuses on tool allowlists and hash pins."
    verify: { type: capture-count, min: 1 }
quiz:
  - question: "Which signal most strongly indicates a developer tool was compromised in this lab?"
    choices:
      - "The tool is installed as a devDependency"
      - "The tool was updated in the last month"
      - "The tool's postinstall script makes network calls during install"
    answer: 2
    explain: "DevDependencies and recent updates are normal. A lifecycle script that opens network connections while npm is still installing is the red flag - legitimate CLI tools rarely need to phone anywhere at install time."
  - question: "When hunting for this attack, where should process and network telemetry focus?"
    choices:
      - "The dependency installation phase, before the app ever starts"
      - "Only production runtime traffic"
      - "Weekly antivirus scans of the repository"
    answer: 0
    explain: "The payload fires during npm install, not at app runtime. EDR should correlate process and network events with the install window; watching only runtime traffic misses the entire attack."
  - question: "Which default would have blocked this lab's payload?"
    choices:
      - "Committing node_modules so installs are skipped"
      - "Installing dev tools with --ignore-scripts from approved registries"
      - "Giving developers faster workstations"
    answer: 1
    explain: "The attack needs its postinstall hook to execute. --ignore-scripts removes that execution path, and approved registries plus pinned checksums keep untrusted tools off the PATH in the first place."
