id: "15"
etaMinutes: 40
category: developer-tools
incidents:
  - "Malicious CLI/dev tools on the PATH"
  - "Trusted toolchain abuse"
caseStudy: "Models malicious developer CLI tools on the PATH: a trusted toolchain install runs lifecycle scripts and can plant persistence or exfiltrate secrets from the workstation."
objectives:
  - "Run a victim that loads a malicious developer tool"
  - "See exfil from tooling rather than app deps"
  - "Lock down tool install sources"
mitigation:
  - "Install dev tools with --ignore-scripts by default from approved registries only"
  - "Pin tool versions and verify checksums before distributing to developers"
  - "Review lockfile and ignore-file diffs after any toolchain install"
  - "Full blue-team runbook: DETECT.md in this lab folder"
drill:
  prompt: "A teammate shares a CLI tool that speeds up local dev. You run the install and watch the output below. Let it finish?"
  artifactType: ci-log
  artifact:
    - "$ npm install -g devtool-cli"
    - "added 1 package in 2s"
    - ""
    - "> devtool-cli@1.2.0 postinstall"
    - "> node ./scripts/setup.js"
    - "reading ~/.aws/credentials..."
    - "reading ~/.ssh/id_rsa..."
    - "reading ~/.npmrc..."
    - "POST https://127.0.0.1:3015/collect 200"
    - "devtool-cli installed successfully. Run 'devtool --help' to begin."
  choices:
    - "Let it finish - it is a dev tool, not an app dependency"
    - "Kill it - a CLI tool is reading my cloud keys, SSH key, and npm token during install"
  answer: 1
  reveal: "The tool is the trojan. Its postinstall read your AWS credentials, your SSH private key, and your npm token, then shipped all three before printing a friendly success message. It never touches your app's dependency tree - it lives on your PATH, trusted, with everything a developer account can reach."
  explanation: "We scrutinize app dependencies and barely glance at tooling, but a CLI on your PATH runs with your full user privileges. The tell is a lifecycle script reading credential files and opening a network connection during install - legitimate CLI tools almost never need to phone anywhere at install time. The defense is to treat tools like dependencies: --ignore-scripts by default, approved registries only, pinned versions with verified checksums."
steps:
  - id: setup
    registry: setup
    audience: both
    title: Prepare legitimate and malicious tools
    teaching: "Setup places legitimate and malicious dev-tool trees and wires the victim to use the bad one in the attack path."
    verify: { type: exit-zero }
  - id: services
    registry: services
    audience: both
    title: Start the mock collector
    teaching: "The malicious tool posts to localhost:3015."
    verify: { type: service-listening }
  - id: install
    registry: install
    audience: attack
    title: Install the malicious developer tool
    teaching: "npm install pulls file:../dev-tools/malicious-dev-tool into victim-app. postinstall posts to the mock collector when TESTBENCH_MODE is enabled."
    hint: "Keep mock :3015 running. Watch Live Output for the postinstall hook."
    verify: { type: capture-count, min: 1 }
  - id: run
    registry: run
    audience: attack
    title: Run victim with malicious tool
    teaching: "npm start requires('dev-tool') and calls run(). Capture already landed during install."
    hint: "If MODULE_NOT_FOUND, re-run the install step first."
    verify: { type: exit-zero }
  - id: detect
    registry: null
    audience: detect
    title: Trust but verify tooling
    teaching: "Compare legitimate-dev-tool vs malicious-dev-tool. DETECT.md focuses on tool allowlists and hash pins."
    verify: { type: capture-count, min: 1 }
quiz:
  - question: "Which signal most strongly indicates a developer tool was compromised in this lab?"
    choices:
      - "The tool is installed as a devDependency"
      - "The tool was updated in the last month"
      - "The tool's postinstall script makes network calls during install"
    answer: 2
    explain: "DevDependencies and recent updates are normal. A lifecycle script that opens network connections while npm is still installing is the red flag - legitimate CLI tools rarely need to phone anywhere at install time."
  - question: "When hunting for this attack, where should process and network telemetry focus?"
    choices:
      - "The dependency installation phase, before the app ever starts"
      - "Only production runtime traffic"
      - "Weekly antivirus scans of the repository"
    answer: 0
    explain: "The payload fires during npm install, not at app runtime. EDR should correlate process and network events with the install window; watching only runtime traffic misses the entire attack."
  - question: "Which default would have blocked this lab's payload?"
    choices:
      - "Committing node_modules so installs are skipped"
      - "Installing dev tools with --ignore-scripts from approved registries"
      - "Giving developers faster workstations"
    answer: 1
    explain: "The attack needs its postinstall hook to execute. --ignore-scripts removes that execution path, and approved registries plus pinned checksums keep untrusted tools off the PATH in the first place."
prTriage:
  afterStep: install
  prs:
    - id: safe-1
      title: "fix: update dev-tools path resolution"
      dependency: "../dev-tools/lib/path.js"
      diffSummary: "Fixed cross-platform path resolution"
      safe: true
    - id: safe-2
      title: "chore: add dev-tools CLI help documentation"
      dependency: "../dev-tools/README.md"
      diffSummary: "Added CLI command reference and usage examples"
      safe: true
    - id: safe-3
      title: "docs: add development tooling guide"
      dependency: "docs/dev-tools.md"
      diffSummary: "Documented recommended development tools and setup"
      safe: true
    - id: safe-4
      title: "test: add dev-tools integration test"
      dependency: "test/dev-tools.test.js"
      diffSummary: "Tests for CLI tool functionality"
      safe: true
    - id: bad-1
      title: "feat: add local dev-tools helper CLI"
      dependency: "../dev-tools"
      diffSummary: "Updated dev-tools with postinstall that steals env vars and secrets"
      safe: false
      blockLabel: "Block — dev-tools postinstall harvests secrets"
    - id: bad-2
      title: "fix: improve dev-tools performance"
      dependency: "../dev-tools/lib/perf.js"
      diffSummary: "Performance improvement that also scans project for secrets"
      safe: false
      blockLabel: "Block — performance tool is a secrets scanner"
    - id: bad-3
      title: "chore: add dev-tools VS Code integration"
      dependency: "../dev-tools/vscode-extension"
      diffSummary: "Extension that sends file contents to external server"
      safe: false
      blockLabel: "Block — VS Code extension leaks code"
    - id: bad-4
      title: "refactor: reorganize dev-tools modules"
      dependency: "../dev-tools/index.js"
      diffSummary: "Restructured dev-tools with hidden network call on import"
      safe: false
      blockLabel: "Block — import-time network call"
