id: "18"
etaMinutes: 40
category: package-manager
incidents:
  - "npm/lifecycle plugin hooks"
  - "Package manager extension abuse"
caseStudy: "Models package-manager plugin and hook abuse (.pnpmfile.cjs, Yarn plugins): install-time hooks rewrite resolution without changing package.json in an obvious way."
objectives:
  - "Trigger malicious plugin hooks via npm start"
  - "Inspect hook-driven exfil"
  - "Restrict plugin and hook surfaces"
mitigation:
  - "Treat .pnpmfile.cjs and .yarn/plugins as code; require CODEOWNERS review"
  - "Use frozen lockfiles in CI and fail if the lockfile changes unexpectedly"
  - "Pin the package manager version and validate its checksum"
  - "Full blue-team runbook: DETECT.md in this lab folder"
steps:
  - id: setup
    registry: setup
    audience: both
    title: Prepare plugin lab packages
    teaching: "Setup wires victim-app and packages that register malicious package-manager hooks."
    verify: { type: exit-zero }
  - id: services
    registry: services
    audience: both
    title: Start the mock collector
    teaching: "Hook payloads post to localhost:3018."
    verify: { type: service-listening }
  - id: install
    registry: install
    audience: attack
    title: pnpm install (load .pnpmfile.cjs)
    teaching: "pnpm loads .pnpmfile.cjs and the readPackage hook injects malicious-logger into target-lib without an obvious package.json change."
    hint: "Keep mock :3018 running. Use the pinned pnpm via npx (the install script does that)."
    verify: { type: exit-zero }
  - id: run
    registry: run
    audience: attack
    title: Run victim so plugin hooks fire
    teaching: "npm start requires target-lib; the injected malicious-logger exfiltrates on import when TESTBENCH_MODE is enabled."
    hint: "If MODULE_NOT_FOUND for target-lib, re-run the pnpm install step after Prepare the lab."
    verify: { type: capture-count, min: 1 }
  - id: detect
    registry: null
    audience: detect
    title: Audit hooks and plugins
    teaching: "DETECT.md lists hook review, ignore-scripts policies, and allowlisted plugins."
    verify: { type: capture-count, min: 1 }
quiz:
  - question: "What is the strongest IOC of this pnpm hook attack?"
    choices:
      - "The project uses pnpm instead of npm"
      - "The lockfile is large and hard to read"
      - "pnpm-lock.yaml lists malicious-logger, which package.json never declared"
    answer: 2
    explain: "Using pnpm is a normal choice. The smoking gun is drift between declared and resolved dependencies: the readPackage hook in .pnpmfile.cjs injects packages at install time, so the lockfile gains entries package.json never asked for."
  - question: "Which file events should detections watch for this attack?"
    choices:
      - "Creation of .pnpmfile.cjs and unexpected pnpm-lock.yaml changes during install"
      - "Edits to documentation files during install"
      - "Every file write anywhere on the developer workstation"
    answer: 0
    explain: "The attack surface is the hook file plus the lockfile it rewrites. Alerting on .pnpmfile.cjs creation and lockfile drift during pnpm install catches both; watching everything is noise and watching docs is nothing."
  - question: "Which CI control would have caught this injection?"
    choices:
      - "Running pnpm install twice to be sure"
      - "Installing with --frozen-lockfile and failing the build if the lockfile changes"
      - "Always upgrading to the latest pnpm release"
    answer: 1
    explain: "A frozen lockfile turns the hook's dependency injection into a build failure, and a git diff gate on pnpm-lock.yaml makes the drift visible. Pinning pnpm's version helps tool integrity but does not review what the hook changed."
