id: "17"
etaMinutes: 45
category: attack-chains
incidents:
  - "Staged access then payload packages"
  - "Multi-phase supply chain ops"
caseStudy: "Models multi-phase supply chain operations: initial dependency access, then CI token abuse, then a later malicious publish - single alerts look unrelated until correlated."
objectives:
  - "Install stage1 then stage2 packages"
  - "See how access and payload roles split"
  - "Detect chain signals end to end"
mitigation:
  - "Correlate install, secret access, and publish events before closing alerts"
  - "Segment CI accounts so build runners cannot publish or deploy to production"
  - "Require approval gates for registry publishes; preserve per-stage forensics"
  - "Full blue-team runbook: DETECT.md in this lab folder"
steps:
  - id: setup
    registry: setup
    audience: both
    title: Prepare the lab
    teaching: "Run setup to create victim, packages, and mock infrastructure for this scenario."
    hint: "Node 18+ (or the language this lab needs). Dashboard Setup runs ./setup.sh for you."
    verify: { type: exit-zero }
  - id: services
    registry: services
    audience: both
    title: Start mock collectors
    teaching: "Start the localhost mock server(s). Exfil only targets 127.0.0.1 when TESTBENCH_MODE is enabled."
    hint: "If a port is busy, free it from Teardown or scripts/setup/kill-port.sh."
    verify: { type: service-listening }
  - id: install
    registry: install
    audience: attack
    title: Install staged packages
    teaching: "Install stage1-access-lib and stage2-compromised-lib together. Stage1 looks like access; stage2 carries the louder payload."
    hint: "Skim both packages before install to see the split roles."
    verify: { type: exit-zero }
  - id: run
    registry: run
    audience: attack
    title: Run the victim
    teaching: "Running the victim exercises the full chain against localhost:3017."
    hint: "Confirm the inspector shows at least one capture."
    verify: { type: capture-count, min: 1 }
  - id: detect
    registry: null
    audience: detect
    title: Read captures and DETECT.md
    teaching: "Open the inspector and the scenario DETECT.md. Map what you see to IOCs and mitigations."
    hint: "Detection tools under detection-tools/ can scan the victim tree from the repo root."
    verify: { type: capture-count, min: 1 }
