id: "17"
etaMinutes: 45
category: attack-chains
incidents:
  - "Staged access then payload packages"
  - "Multi-phase supply chain ops"
caseStudy: "Models multi-phase supply chain operations: initial dependency access, then CI token abuse, then a later malicious publish - single alerts look unrelated until correlated."
objectives:
  - "Install stage1 then stage2 packages"
  - "See how access and payload roles split"
  - "Detect chain signals end to end"
mitigation:
  - "Correlate install, secret access, and publish events before closing alerts"
  - "Segment CI accounts so build runners cannot publish or deploy to production"
  - "Require approval gates for registry publishes; preserve per-stage forensics"
  - "Full blue-team runbook: DETECT.md in this lab folder"
drill:
  prompt: "Your SIEM fired three low-severity alerts from the same CI runner over six minutes. Each one was auto-closed as benign. The timeline is below. Was closing them right?"
  artifactType: ci-log
  artifact:
    - "14:02:11  [LOW] npm install completed on ci-runner-7  -> auto-closed (routine)"
    - "14:04:38  [LOW] process read ~/.npmrc on ci-runner-7  -> auto-closed (common)"
    - "14:07:55  [LOW] registry publish from ci-runner-7    -> auto-closed (expected)"
    - ""
    - "each alert below the severity threshold on its own"
    - "no rule joins events across the six-minute window"
  choices:
    - "Right call - three low-severity alerts, all routine CI activity"
    - "Wrong call - install, then token access, then a publish from one host is a single attack chain"
  answer: 1
  reveal: "Three benign events are one breach. The install pulled a stage-1 package, the .npmrc read stole the CI publish token, and the publish shipped a poisoned release - all from the same runner in six minutes. Each alert was below threshold on its own, so per-alert triage closed every one. The attack only exists in the correlation."
  explanation: "Multi-stage operations are engineered to look like noise when you read alerts one at a time. Install, secret access, and publish are each routine in isolation; joined into a timeline from a single host, they are unambiguous. The fix is a correlator that connects the stages, plus segmentation so the build runner's identity cannot publish in the first place - then stage 3 fails on permissions even if stage 1 succeeds."
steps:
  - id: setup
    registry: setup
    audience: both
    title: Prepare the lab
    teaching: "Run setup to create victim, packages, and mock infrastructure for this scenario."
    hint: "Node 18+ (or the language this lab needs). Dashboard Setup runs ./setup.sh for you."
    verify: { type: exit-zero }
  - id: services
    registry: services
    audience: both
    title: Start mock collectors
    teaching: "Start the localhost mock server(s). Exfil only targets 127.0.0.1 when TESTBENCH_MODE is enabled."
    hint: "If a port is busy, free it from Teardown or scripts/setup/kill-port.sh."
    verify: { type: service-listening }
  - id: install
    registry: install
    audience: attack
    title: Install staged packages
    teaching: "Install stage1-access-lib and stage2-compromised-lib together. Stage1 looks like access; stage2 carries the louder payload."
    hint: "Skim both packages before install to see the split roles."
    verify: { type: exit-zero }
  - id: run
    registry: run
    audience: attack
    title: Run the victim
    teaching: "Running the victim exercises the full chain against localhost:3017."
    hint: "Confirm the inspector shows at least one capture."
    verify: { type: capture-count, min: 1 }
  - id: detect
    registry: null
    audience: detect
    title: Read captures and DETECT.md
    teaching: "Open the inspector and the scenario DETECT.md. Map what you see to IOCs and mitigations."
    hint: "Detection tools under detection-tools/ can scan the victim tree from the repo root."
    verify: { type: capture-count, min: 1 }
quiz:
  - question: "Which pattern is the strongest IOC of this multi-stage chain?"
    choices:
      - "A single npm install on a build runner"
      - "Install, secret access, and registry publish events from the same host in a short window"
      - "A dependency with a major version jump"
    answer: 1
    explain: "Each stage alone looks like normal CI noise. The IOC is the correlation: dependency install, then .npmrc or CI token access, then a publish, all from one host or run context within minutes."
  - question: "Why does per-alert triage miss this attack, and what catches it?"
    choices:
      - "Alerts are too noisy, so muting them reveals the attack"
      - "The attack is encrypted, so nothing can detect it"
      - "Each stage is low-signal alone; a correlator that joins the stages into one chain catches it"
    answer: 2
    explain: "Stage events are individually benign-looking, so alert-by-alert review closes them as false positives. Detection has to join install, token access, and publish into a single timeline, like the lab's multi-stage-correlator does."
  - question: "Which control breaks the chain even if stage 1 succeeds?"
    choices:
      - "Segmenting CI service accounts so build runners cannot publish packages"
      - "Rotating the CI runner's hostname"
      - "Updating dependencies more frequently"
    answer: 0
    explain: "The chain needs one identity to go from build to publish. If the build runner's token cannot publish, stage 3 fails on permissions; approval gates and auto-containment on the event sequence add more chances to stop it."
prTriage:
  afterStep: install
  prs:
    - id: safe-1
      title: "fix: update multi-stage build configuration"
      dependency: "Dockerfile"
      diffSummary: "Fixed stage dependencies for reproducibility"
      safe: true
    - id: safe-2
      title: "chore: add build artifact verification"
      dependency: "scripts/verify-artifacts.sh"
      diffSummary: "Script to verify build artifacts match source"
      safe: true
    - id: safe-3
      title: "docs: add multi-stage build documentation"
      dependency: "docs/build.md"
      diffSummary: "Documented build pipeline and artifact flow"
      safe: true
    - id: safe-4
      title: "test: add end-to-end build test"
      dependency: "test/build-e2e.test.js"
      diffSummary: "E2E test for full build pipeline"
      safe: true
    - id: bad-1
      title: "feat: add multi-stage build optimization"
      dependency: "Dockerfile"
      diffSummary: "Optimized build that injects malicious code in second stage"
      safe: false
      blockLabel: "Block — second stage injects malware"
    - id: bad-2
      title: "fix: update CI pipeline for multi-stage build"
      dependency: ".github/workflows/build.yaml"
      diffSummary: "Pipeline that passes secrets between stages to attacker"
      safe: false
      blockLabel: "Block — pipeline leaks secrets between stages"
    - id: bad-3
      title: "chore: add build artifact signing"
      dependency: "scripts/sign-artifacts.sh"
      diffSummary: "Signing script that also embeds attacker-signed artifacts"
      safe: false
      blockLabel: "Block — signing embeds attacker artifacts"
    - id: bad-4
      title: "refactor: reorganize build pipeline stages"
      dependency: "Dockerfile"
      diffSummary: "Reorganized with hidden stage that exfiltrates build context"
      safe: false
      blockLabel: "Block — hidden exfiltration stage"
