id: "05"
etaMinutes: 45
category: ci-cd
incidents:
  - "Codecov bash uploader (2021)"
  - "SolarWinds build tooling compromise (2020)"
  - "Trivy action tag force-push campaign (see lab 23)"
caseStudy: "Same pattern as the 2021 Codecov bash uploader and SolarWinds-style build tooling abuse: a trusted CI helper runs with secrets and can exfiltrate or alter what the pipeline produces."
objectives:
  - "See how a mutable action tag (@v1) becomes an attack surface"
  - "Run a local CI simulation that steals GITHUB_TOKEN-style secrets to localhost"
  - "Apply SHA pinning and least-privilege ideas from DETECT.md"
mitigation:
  - "Pin third-party GitHub Actions to immutable commit SHAs, not mutable tags"
  - "Set minimum workflow permissions; avoid contents: write unless required"
  - "Do not hand long-lived secrets to third-party actions; prefer OIDC short-lived tokens"
  - "Full blue-team runbook: DETECT.md in this lab folder"
drill:
  prompt: "Your CI pipeline ran this morning and went green. One step in the log is below. Anything worth a second look?"
  artifactType: ci-log
  artifact:
    - "[build] Run actions/setup-node@v4"
    - "[build] node version: v20.11.0"
    - "[build] Run npm ci"
    - "[build] added 214 packages in 9s"
    - "[build] Run codecov/codecov-action@v3"
    - "[build] Uploading coverage report..."
    - "[build] env: GITHUB_TOKEN=*** AWS_SECRET_ACCESS_KEY=*** NPM_TOKEN=***"
    - "[build] POST https://127.0.0.1:3000/collect 200"
    - "[build] Coverage uploaded successfully"
    - "[build] Run npm run build"
    - "[build] Build completed in 41s"
  choices:
    - "Green build, coverage uploaded - move on"
    - "Stop - the coverage step dumped the CI secrets and POSTed them somewhere"
  answer: 1
  reveal: "The green checkmark is the camouflage. The codecov step did upload coverage, but it also read every CI secret in the environment and shipped them to a collector before reporting success. This is the Codecov bash uploader pattern: a trusted build helper running with your secrets, exfiltrating while the log still says success."
  explanation: "CI logs are built to reassure you. Every line here looks routine until you read the two that matter: env dumped in full, then an outbound POST. The step stays green precisely so nobody scrolls back. Hunting this means reading for the secret-access-then-egress sequence, not for failures - the attack is designed to produce none."
steps:
  - id: setup
    registry: setup
    audience: both
    title: Prepare the workflow lab
    teaching: "Setup wires the victim workflow, the compromised reusable action, and the localhost mock that stands in for attacker C2."
    hint: "Read the victim workflow and the action entrypoint before you run CI. Note the @v1-style pin."
    verify: { type: exit-zero }
  - id: services
    registry: services
    audience: both
    title: Start the mock collector
    teaching: "When the compromised action runs, it POSTs harvested CI secrets and artifact metadata to 127.0.0.1:3000."
    hint: "Keep this service up for the full CI run."
    verify: { type: service-listening }
  - id: run-ci
    registry: run-ci
    audience: attack
    title: Run the compromised CI pipeline
    teaching: "This step runs build.yml with nektos/act when act is installed. The runner card lists each uses: line and the folder act binds it to. The terminal prints that same map, then the act log. A banner that says Node simulator means build.yml did not run."
    hint: "Read the SCAS runner banner before the act log. The publish step is vendor/build-action@v1."
    verify: { type: capture-count, min: 1 }
  - id: detect
    registry: null
    audience: detect
    title: Harden the workflow
    teaching: "Inspect the capture, then open DETECT.md. Pin actions by commit SHA, drop unnecessary permissions, and treat reusable actions like any other dependency."
    hint: "Optional Floci seed/verify buttons exist on this lab if you are on the cloud track."
    verify: { type: capture-count, min: 1 }
quiz:
  - question: "What is the strongest IOC that a workflow is exposed to action hijacking?"
    choices:
      - "A workflow references a third-party action by a mutable tag like @v1 instead of a commit SHA"
      - "The workflow runs on ubuntu-latest"
      - "The workflow has more than three steps"
    answer: 0
    explain: "A mutable tag is a pointer the action owner can move, and a force-push turns your trusted build step into their code. Runner image and step count are ordinary choices with no security meaning on their own."
  - question: "Which CI behavior should trigger an alert during a build?"
    choices:
      - "Build times that vary by a few seconds between runs"
      - "A build step that enumerates process.env and then opens an outbound connection"
      - "Developers pushing commits during business hours"
    answer: 1
    explain: "Secret harvesting has a signature sequence: read the environment, then ship it. A runner process that touches GITHUB_TOKEN or cloud keys and immediately makes an HTTP request is the alert. Build-time jitter is normal noise."
  - question: "Which control stops a force-pushed action tag from executing in your pipeline?"
    choices:
      - "Granting every job contents: write so builds never fail"
      - "Passing all repository secrets to every action for convenience"
      - "Pinning every third-party action to an immutable commit SHA and verifying with an allowlist"
    answer: 2
    explain: "SHA pinning freezes the exact code you reviewed, so a force-pushed tag can no longer swap it. The other two options are the conditions that made this lab work: broad permissions and secrets handed to code you do not control."
