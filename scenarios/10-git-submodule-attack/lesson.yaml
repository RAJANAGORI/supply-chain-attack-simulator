id: "10"
etaMinutes: 35
category: source-control
incidents:
  - "Malicious git submodule swaps"
  - "Pinning commits vs moving refs"
caseStudy: "Models malicious git submodule and vendored-path swaps (including local protocol abuse like CVE-2022-39253): a moving ref or file:// embed replaces trusted code at clone time."
objectives:
  - "See how a submodule can pull attacker-controlled code"
  - "Install and run after the submodule compromise"
  - "Pin submodules by commit SHA"
mitigation:
  - "Review every submodule or vendored path addition; allowlist remote URLs"
  - "Pin embeds to verified commits; do not track floating branch heads"
  - "Set protocol.file.allow=never on developer machines and CI runners"
  - "Full blue-team runbook: DETECT.md in this lab folder"
drill:
  prompt: "A PR adds a submodule to pull in a shared library. The .gitmodules diff is the whole change. Merge it?"
  artifactType: diff
  artifact:
    - "diff --git a/.gitmodules b/.gitmodules"
    - "new file"
    - "+[submodule \"libs/shared-utils\"]"
    - "+    path = libs/shared-utils"
    - "+    url = file:///opt/vendor/shared-utils"
    - ""
    - "diff --git a/package.json b/package.json"
    - "@@ -6,6 +6,7 @@"
    - "   \"scripts\": {"
    - "+    \"postinstall\": \"bash libs/shared-utils/postinstall.sh\","
    - "     \"start\": \"node index.js\""
    - "   }"
  choices:
    - "Merge - submodules are how we share code"
    - "Reject - a file:// submodule URL plus a postinstall that runs its script is a trap"
  answer: 1
  reveal: "Two red flags in four lines. The file:// URL means the submodule content comes from a local path, not a remote you can review - that is the CVE-2022-39253 local-protocol pattern. And the parent's postinstall hands that submodule a shell the moment the clone finishes. Fetch, then execute, from code nobody reviewed."
  explanation: "Submodules feel like a code-reuse convenience, so the URL field rarely gets a second look. But a file:// or relative-path URL resolves to whatever is on disk, and protocol.file.allow=always lets git follow it. Pair that with a postinstall that runs the submodule's script and the attacker controls code that executes at clone time. The fix is boring and total: protocol.file.allow=never, pinned commits, and an allowlist of remote URLs."
steps:
  - id: setup
    registry: setup
    audience: both
    title: Prepare the lab
    teaching: "Run setup to create victim, packages, and mock infrastructure for this scenario."
    hint: "Node 18+ (or the language this lab needs). Dashboard Setup runs ./setup.sh for you."
    verify: { type: exit-zero }
  - id: services
    registry: services
    audience: both
    title: Start mock collectors
    teaching: "Start the localhost mock server(s). Exfil only targets 127.0.0.1 when TESTBENCH_MODE is enabled."
    hint: "If a port is busy, free it from Teardown or scripts/setup/kill-port.sh."
    verify: { type: service-listening }
  - id: install
    registry: install
    audience: attack
    title: Clone repo and trigger submodule install
    teaching: "This clones work/awesome-project with --recurse-submodules, then runs npm install so the malicious submodule postinstall posts to the mock collector."
    hint: "Keep the mock server on :3000 running. If clone fails, re-run Prepare the lab so build-repos.sh recreates work/."
    verify: { type: capture-count, min: 1 }
  - id: run
    registry: run
    audience: attack
    title: Run the cloned project
    teaching: "Loads the compromised clone. The capture already landed during install; this step confirms the victim tree still runs."
    hint: "If this fails with missing work/victim-clone, re-run the install step first."
    verify: { type: exit-zero }
  - id: detect
    registry: null
    audience: detect
    title: Read captures and DETECT.md
    teaching: "Open the inspector and the scenario DETECT.md. Map what you see to IOCs and mitigations."
    hint: "Detection tools under detection-tools/ can scan work/victim-clone from the scenario folder."
    verify: { type: capture-count, min: 1 }
quiz:
  - question: "Which .gitmodules entry should fail code review on sight?"
    choices:
      - "A submodule pinned to a full 40-character commit SHA"
      - "A submodule cloned over https from an allowlisted org remote"
      - "A submodule with a file:// or relative-path URL"
    answer: 2
    explain: "Local protocol URLs are the CVE-2022-39253 pattern - they let a clone pull attacker-planted content from local paths, and this lab works only because protocol.file.allow is set to always. Pinned SHAs and allowlisted https remotes are the state you want, not IOCs."
  - question: "Which process chain should your EDR alert on during a build?"
    choices:
      - "npm ci resolving packages from the registry"
      - "git clone --recurse-submodules followed by bash executing postinstall.sh from inside the submodule path"
      - "git submodule status printing commit SHAs"
    answer: 1
    explain: "The kill chain is fetch-then-execute: the submodule lands on disk and the parent postinstall hands it a shell, which is the Sigma rule in DETECT.md. Registry resolution and status output are read-only noise - alert on the sequence, not on git commands in isolation."
  - question: "Which change would have blocked this lab's attack outright?"
    choices:
      - "Setting protocol.file.allow=never in git config on developer machines and CI runners"
      - "Cloning with --depth 1 to limit history"
      - "Renaming .gitmodules so tooling cannot find it"
    answer: 0
    explain: "The attack needs the local file protocol to resolve, and protocol.file.allow=never closes that hole everywhere the config is set. Shallow clones still fetch submodule content, and renaming .gitmodules breaks legitimate submodules instead of the attacker. Pair the config with pinned commits and URL allowlists for the remote cases."
