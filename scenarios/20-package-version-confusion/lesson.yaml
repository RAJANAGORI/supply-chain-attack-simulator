id: "20"
etaMinutes: 35
category: package-registry
incidents:
  - "Highest version wins resolution tricks"
  - "Version confusion across registries"
caseStudy: "Models version confusion across registries: highest version wins, so a higher public build of an internal name can beat the private package you meant to install."
objectives:
  - "Install when a higher malicious version wins"
  - "Run the victim under that resolution"
  - "Pin exact versions and registries"
mitigation:
  - "Pin expected builder identity and refs; verify provenance fail-closed"
  - "Still run behavioral scans even when signatures verify"
  - "Segment CI so build runners cannot sign arbitrary artifacts"
  - "Full blue-team runbook: DETECT.md in this lab folder"
reversal:
  blockedPackage: "trusted-logger"
drill:
  prompt: "Your app depends on an internal package, trusted-logger, pinned to ^1.2.0 on your private registry. This morning npm resolved a newer copy. The resolution detail is below. Anything off?"
  artifactType: ci-log
  artifact:
    - "[resolve] trusted-logger"
    - "[resolve]   private registry: 1.2.4  (your internal build)"
    - "[resolve]   public npmjs:    9.9.9  (published 6 hours ago)"
    - "[resolve] selected: 9.9.9  <- highest version wins"
    - "[verify] provenance signature: VALID"
    - "[verify] attestation: VALID"
    - "[runtime] node_modules/trusted-logger -> POST 127.0.0.1:3020"
  choices:
    - "Fine - npm picked the newest version and the signatures verify"
    - "Stop - an internal name resolved to a public package at 9.9.9, and valid signatures do not make it yours"
  answer: 1
  reveal: "Highest version wins, and the attacker knew it. They published trusted-logger 9.9.9 to public npm, and your caret range resolved to it over your own internal 1.2.4. The provenance and attestation both verify - because the attacker signed their own poisoned artifact. Valid signatures prove the package is authentic; they say nothing about whether it is the one you meant to install."
  explanation: "Version confusion exploits resolution order, not broken crypto. A public package with the same name and a higher version beats your private one under a caret range, and because the attacker controls the publish, every signature check passes. The defense is to remove the ambiguity: pin exact versions, scope internal names to your registry, and fail closed on any builder identity or ref you did not expect - then keep behavioral scans running for the day identity checks are not enough."
steps:
  - id: setup
    registry: setup
    audience: both
    title: Prepare the lab
    teaching: "Run setup to create victim, packages, and mock infrastructure for this scenario."
    hint: "Node 18+ (or the language this lab needs). Dashboard Setup runs ./setup.sh for you."
    verify: { type: exit-zero }
  - id: services
    registry: services
    audience: both
    title: Start mock collectors
    teaching: "Start the localhost mock server(s). Exfil only targets 127.0.0.1 when TESTBENCH_MODE is enabled."
    hint: "If a port is busy, free it from Teardown or scripts/setup/kill-port.sh."
    verify: { type: service-listening }
  - id: install
    registry: install
    audience: attack
    title: Install dependencies
    teaching: "Resolution prefers the highest satisfying version. The lab plants a malicious higher version that wins."
    hint: "Watch the live terminal for install hooks."
    verify: { type: exit-zero }
  - id: run
    registry: run
    audience: attack
    title: Run the victim
    teaching: "npm start uses the winning malicious version and posts to localhost:3020."
    hint: "Confirm the inspector shows at least one capture."
    verify: { type: capture-count, min: 1 }
  - id: detect
    registry: null
    audience: detect
    title: Read captures and DETECT.md
    teaching: "Open the inspector and the scenario DETECT.md. Map what you see to IOCs and mitigations."
    hint: "Detection tools under detection-tools/ can scan the victim tree from the repo root."
    verify: { type: capture-count, min: 1 }
quiz:
  - question: "Both the provenance and attestation for trusted-logger 9.9.9 verify cleanly. What is the strongest IOC that something is wrong?"
    choices:
      - "A signature verification error in the application logs"
      - "A runtime beacon to 127.0.0.1:3020 from node_modules/trusted-logger right after the package loads"
      - "A postinstall script declared in the package"
    answer: 1
    explain: "There are no verification errors and no postinstall script, so those alerts never fire. The tell is behavioral: the package logs Provenance signature valid: YES and then immediately opens a connection it has no legitimate reason to open."
  - question: "Every signature verifies, so which hunt still catches this package?"
    choices:
      - "Alerting on any failed attestation check"
      - "Watching for install-time script execution"
      - "Correlating provenance builder identities against an allowlist and watching for network calls right after package load"
    answer: 2
    explain: "Failure-based alerts stay quiet because nothing fails, and the abuse runs at require time, not in an install hook. The working signals are an unexpected builder.id or feature-branch ref in the provenance and an outbound connection from the package path seconds after it loads."
  - question: "Which mitigation actually stops this attack instead of just documenting it?"
    choices:
      - "Pin expected builder identity, repository, and ref in a fail-closed policy, and keep behavioral scans even when signatures verify"
      - "Set provenance=true and trust any package that passes npm audit signatures"
      - "Rotate the registry TLS certificate"
    answer: 0
    explain: "The malicious release carries valid provenance and a valid attestation, so requiring signatures changes nothing. Failing closed on any builder or ref you did not expect removes the attacker's room to sign a poisoned artifact, and behavioral scans catch what identity checks miss."
