id: "13"
etaMinutes: 35
category: package-compromise
incidents:
  - "npm metadata and README social engineering"
  - "Clean names with dirty payloads"
caseStudy: "Models npm metadata and README social engineering: clean names, polished docs, and trusted-looking homepage fields hide a dirty tarball payload."
objectives:
  - "Spot metadata that looks legitimate while the tarball is not"
  - "Install clean-utils and observe /capture exfil"
  - "Use metadata diffs in detection"
mitigation:
  - "Do not trust README marketing; compare homepage and repository URLs to a trusted source"
  - "Reject registry metadata that disagrees with tarball package.json fields"
  - "Require human review when author, homepage, or repository fields change on a dependency"
  - "Full blue-team runbook: DETECT.md in this lab folder"
steps:
  - id: setup
    registry: setup
    audience: both
    title: Prepare the lab
    teaching: "Run setup to create victim, packages, and mock infrastructure for this scenario."
    hint: "Node 18+ (or the language this lab needs). Dashboard Setup runs ./setup.sh for you."
    verify: { type: exit-zero }
  - id: services
    registry: services
    audience: both
    title: Start mock collectors
    teaching: "Start the localhost mock server(s). Exfil only targets 127.0.0.1 when TESTBENCH_MODE is enabled."
    hint: "If a port is busy, free it from Teardown or scripts/setup/kill-port.sh."
    verify: { type: service-listening }
  - id: install
    registry: install
    audience: attack
    title: Install the metadata-tampered package
    teaching: "compromised-packages/clean-utils advertises a safe story in metadata while the payload exfiltrates on load."
    hint: "Compare package.json description and scripts against the index.js payload."
    verify: { type: exit-zero }
  - id: run
    registry: run
    audience: attack
    title: Run the victim
    teaching: "Captures land on port 3001 (POST /capture, view via /captured-data)."
    hint: "Confirm the inspector shows at least one capture."
    verify: { type: capture-count, min: 1 }
  - id: detect
    registry: null
    audience: detect
    title: Read captures and DETECT.md
    teaching: "Open the inspector and the scenario DETECT.md. Map what you see to IOCs and mitigations."
    hint: "Detection tools under detection-tools/ can scan the victim tree from the repo root."
    verify: { type: capture-count, min: 1 }
quiz:
  - question: "Which metadata signal is the strongest IOC that a clean-looking package is manipulated?"
    choices:
      - "The package has a polished README with a project logo"
      - "The registry API and the tarball's package.json disagree on repository, author, or homepage"
      - "The package description mentions enterprise use cases"
    answer: 1
    explain: "Attackers write metadata for humans and payloads for machines. When the registry listing and the tarball you actually install tell different stories about repository or author, one of them is lying - DETECT.md flags exactly this mismatch. Polished docs and enterprise language are marketing, not evidence."
  - question: "How do you hunt metadata manipulation at scale before a package ever runs?"
    choices:
      - "Diffing runtime syscalls against a baseline"
      - "Watching for outbound traffic to the capture port"
      - "Comparing npm view metadata against the packed tarball's package.json and rejecting mismatches in CI"
    answer: 2
    explain: "This is a pre-execution catch - metadata-validator.js style checks compare registry API fields with tarball package.json and fail the build on author, repository, homepage, or dist.integrity drift. Syscall baselines and network watches only fire after the payload already ran, which is too late for a metadata attack."
  - question: "Which mitigation stops metadata manipulation from reaching developers?"
    choices:
      - "Human review for any dependency change that alters homepage, repository, or author fields, backed by an approved-artifact mirror"
      - "Trusting packages with high weekly download counts"
      - "Reading the README more carefully before installing"
    answer: 0
    explain: "A field-change gate turns the attacker's best trick - a trusted-looking story - into a review trigger, and a signed internal mirror gives you a source of truth to compare against. Download counts are gameable and say nothing about metadata drift, and README reading is exactly the surface this attack exploits."
