id: "23"
etaMinutes: 45
category: ci-cd
incidents:
  - "Compromised Trivy / scanner modules"
  - "Security tool as attack path"
caseStudy: "Models compromised scanner modules and mutable Trivy action tags: the security tool in CI becomes the delivery path, with force-pushed tags swapping trusted SHAs for malicious ones."
objectives:
  - "Install a compromised scanner module into CI victim"
  - "See C2-style posts to localhost:3023"
  - "Trust but verify security tooling"
mitigation:
  - "Replace mutable action tags with immutable commit SHAs everywhere"
  - "Disable and re-queue pipelines that ran known-bad scanner action versions"
  - "Rotate CI secrets reachable by affected runs; hunt workflows for bad version strings"
  - "Full blue-team runbook: DETECT.md in this lab folder"
drill:
  prompt: "Your CI uses a security scanner action to catch vulnerabilities. This morning's run went green. The network egress from the runner is below. Anything to chase?"
  artifactType: ci-log
  artifact:
    - "[ci] Run aquasecurity/trivy-action@0.34.1"
    - "[ci] Scanning image for vulnerabilities..."
    - "[ci] 0 critical, 2 high, 11 medium"
    - "[ci] Scan completed successfully"
    - "--- runner egress during the scan step ---"
    - "[net] POST https://scan.aquasecurtiy.org/upload  200"
    - "[net]   note: aquasecurtiy.org - missing the second 'i' in aquasecurity"
    - "[net]   payload: CI env, GITHUB_TOKEN, cloud credentials"
  choices:
    - "Nothing to chase - the scanner ran clean and found only routine CVEs"
    - "Chase it - the runner POSTed CI secrets to a typosquat of the scanner's own domain"
  answer: 1
  reveal: "The security tool was the attack path. The scan ran, reported normal findings, and stayed green - while the compromised action POSTed your CI secrets to scan.aquasecurtiy.org, a typosquat missing the second i in aquasecurity. The tool you added to find vulnerabilities is the one that exfiltrated your credentials."
  explanation: "Compromised scanner runs are designed to look clean, so the findings report is the wrong place to look. The signal is in the egress: a runner beaconing to a lookalike domain right after the scanner step starts. The root cause is the mutable action tag - @0.34.1 is a pointer that was force-pushed to code you never reviewed. Pin the scanner to an immutable commit SHA and enforce it with CI policy, because the tool watching your supply chain is part of it."
steps:
  - id: setup
    registry: setup
    audience: both
    title: Prepare Trivy compromise lab
    teaching: "Setup installs the compromised module via a local file path into victim-ci and prepares the mock C2 server."
    verify: { type: exit-zero }
  - id: services
    registry: services
    audience: both
    title: Start mock C2 server
    teaching: "mock-c2-server.js on 3023 stands in for attacker C2. Traffic stays on localhost."
    verify: { type: service-listening }
  - id: install
    registry: install
    audience: attack
    title: Install compromised trivy module
    teaching: "npm install in victim-ci ensures the compromised scanner module is present for the CI victim."
    verify: { type: exit-zero }
  - id: run
    registry: run
    audience: attack
    title: Run CI victim
    teaching: "The victim CI path invokes the bad scanner module, which beacons to the mock C2."
    verify: { type: capture-count, min: 1 }
  - id: detect
    registry: null
    audience: detect
    title: Verify security tools too
    teaching: "Pin scanner versions by digest/SHA and monitor unexpected network from CI. See DETECT.md and Floci options."
    verify: { type: capture-count, min: 1 }
quiz:
  - question: "What is the strongest IOC that the Trivy supply chain attack hit your org?"
    choices:
      - "The trivy-action step completes without errors"
      - "A workflow file references a third-party action"
      - "An outbound POST from a CI runner to scan.aquasecurtiy.org, a typosquat of aquasecurity, right after the trivy-action step starts"
    answer: 2
    explain: "Clean step output is by design - the infostealer preserves normal logs to stay invisible - and third-party actions are everyday CI. A runner beaconing to a lookalike domain missing the t in aquasecurity is unambiguous exfiltration."
  - question: "Where do you hunt for exposure across the org?"
    choices:
      - "Workflow YAML and Dockerfiles for trivy-action@v0.34.x, setup-trivy up to v0.2.5, and trivy:0.69.4 through 0.69.6, plus GitHub audit logs for a tpcp-docs repo"
      - "Pipeline logs, looking for failed scanner steps"
      - "The scanner findings, looking for missing CVEs"
    answer: 0
    explain: "Compromised runs finish green and scanner output looks normal, so failure-based checks find nothing. Exposure lives in version strings across workflow files and image tags, and the tpcp-docs repository is the attacker's backup exfil channel."
  - question: "Which change keeps a force-pushed action tag from running attacker code in your CI again?"
    choices:
      - "Bumping every workflow to the newest trivy-action tag"
      - "Pinning actions to immutable commit SHAs and enforcing it with CI policy"
      - "Adding more secrets to the CI environment"
    answer: 1
    explain: "The attack worked because a tag moved to code you never reviewed, and a newer tag is just as mutable. A full SHA points at one immutable snapshot, and policy enforcement through harden-runner, Allstar, or CI lint keeps tags from creeping back."

prTriage:
  prTriageStep: true
  prs:
    - id: safe-1
      title: "fix: update Trivy database URL"
      dependency: "trivy-config.yaml"
      diffSummary: "Fixed database URL to official vulnerability mirror"
      safe: true
    - id: safe-2
      title: "chore: add Trivy CI scan configuration"
      dependency: ".github/workflows/scan.yaml"
      diffSummary: "Added Trivy vulnerability scan to CI pipeline"
      safe: true
    - id: safe-3
      title: "docs: add Trivy policy and thresholds"
      dependency: "docs/trivy-policy.md"
      diffSummary: "Documented scan thresholds and remediation process"
      safe: true
    - id: safe-4
      title: "test: add Trivy scan test with known vulns"
      dependency: "test/trivy-test.sh"
      diffSummary: "Test to verify Trivy detects known vulnerabilities"
      safe: true
    - id: bad-1
      title: "feat: add Trivy config for CI optimization"
      dependency: "trivy-config.yaml"
      diffSummary: "Config that suppresses critical vulnerability findings"
      safe: false
      blockLabel: "Block — config suppresses critical findings"
    - id: bad-2
      title: "fix: update Trivy scan to skip low-severity issues"
      dependency: "trivy-config.yaml"
      diffSummary: "Scan config that skips checks for the lab's attack vector"
      safe: false
      blockLabel: "Block — scan config hides attack vector"
    - id: bad-3
      title: "chore: add Trivy cache for faster CI"
      dependency: "scripts/trivy-cache.sh"
      diffSummary: "Cache script that uses poisoned vulnerability database"
      safe: false
      blockLabel: "Block — uses poisoned vuln DB cache"
    - id: bad-4
      title: "refactor: extract Trivy scan to shared library"
      dependency: "lib/trivy-scan.js"
      diffSummary: "Scan wrapper that modifies exit codes to always pass"
      safe: false
      blockLabel: "Block — scanner always passes"
