id: "09"
etaMinutes: 40
category: package-integrity
incidents:
  - "Unsigned package installs in CI"
  - "Signature verification gaps"
caseStudy: "Covers signature and provenance gaps in CI: unsigned or weakly verified packages still install when pipelines treat signing as optional instead of fail-closed."
objectives:
  - "Explain what package signing is supposed to stop"
  - "Install an unsigned compromised package in the lab"
  - "List verification controls from DETECT.md"
mitigation:
  - "Publish with provenance and verify with npm audit signatures or attestation tools"
  - "Treat signatures as identity signals; still run behavioral and content scanning"
  - "Protect signing keys in HSM/KMS with MFA, rotation, and audit logs"
  - "Full blue-team runbook: DETECT.md in this lab folder"
steps:
  - id: setup
    registry: setup
    audience: both
    title: Prepare the lab
    teaching: "Run setup to create victim, packages, and mock infrastructure for this scenario."
    hint: "Node 18+ (or the language this lab needs). Dashboard Setup runs ./setup.sh for you."
    verify: { type: exit-zero }
  - id: services
    registry: services
    audience: both
    title: Start mock collectors
    teaching: "Start the localhost mock server(s). Exfil only targets 127.0.0.1 when TESTBENCH_MODE is enabled."
    hint: "If a port is busy, free it from Teardown or scripts/setup/kill-port.sh."
    verify: { type: service-listening }
  - id: install
    registry: install
    audience: attack
    title: Install the unsigned compromised package
    teaching: "The compromised secure-utils ships without a trustworthy signature path the lab enforces. npm still installs it from the local path."
    hint: "Compare legitimate-package vs compromised-package signing metadata."
    verify: { type: exit-zero }
  - id: run
    registry: run
    audience: attack
    title: Run the victim
    teaching: "Runtime load triggers localhost exfil under TESTBENCH_MODE."
    hint: "Confirm the inspector shows at least one capture."
    verify: { type: capture-count, min: 1 }
  - id: detect
    registry: null
    audience: detect
    title: Read captures and DETECT.md
    teaching: "Open the inspector and the scenario DETECT.md. Map what you see to IOCs and mitigations."
    hint: "Detection tools under detection-tools/ can scan the victim tree from the repo root."
    verify: { type: capture-count, min: 1 }
quiz:
  - question: "Which finding is the strongest IOC that a properly signed package is actually compromised?"
    choices:
      - "The package ships without a package.sig file"
      - "The compromised version and the last good version both verify under the same key fingerprint"
      - "The package jumped a minor version number"
    answer: 1
    explain: "A stolen Ed25519 key means v1.0.0 and v1.0.1 both pass crypto.verify() with one keyId - the signature is valid but the key is compromised, which is the keyCompromised: true capture in this lab. A missing signature is a different, noisier failure, and version bumps are routine."
  - question: "crypto.verify() returns VALID for a package your behavioral scanner flags for postinstall exfiltration. How should you treat that?"
    choices:
      - "Treat it as critical - a valid signature proves who signed the package, not what the code does"
      - "Trust the signature and close the behavioral alert as a false positive"
      - "Re-run verification with a different algorithm before deciding"
    answer: 0
    explain: "Signature checks answer identity and integrity only. With a stolen key, verification passes while postinstall beacons out - the DETECT.md Sigma rule keys on exactly that postinstall-plus-network pattern. Re-verifying with another algorithm changes nothing because the math was never the problem."
  - question: "Which control actually limits the damage of a stolen signing key?"
    choices:
      - "Publishing every package with a longer Ed25519 key"
      - "Requiring two maintainers to approve every release pull request"
      - "Keys in an HSM or KMS with MFA, rotation, and signing audit logs, paired with behavioral scanning of signed artifacts"
    answer: 2
    explain: "Hardware-backed keys with MFA and audit logs make key theft hard and visible, and rotation bounds how long a stolen key stays useful. Longer keys do nothing once the key leaves the HSM, and pull request approvals do not stop an attacker who already holds the key - behavioral scanning is what catches the signed-but-malicious package."
