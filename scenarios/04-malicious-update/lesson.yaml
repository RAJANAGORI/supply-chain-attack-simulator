id: "04"
etaMinutes: 35
category: package-compromise
incidents:
  - "coa and rc malicious updates (2021)"
  - "ua-parser-js crypto-miner releases (2021)"
caseStudy: "Mirrors the 2021 coa/rc malicious updates and ua-parser-js miner releases: an existing dependency ships a bad patch that victims pull through loose ranges or unreviewed updates."
objectives:
  - "Explain how caret and tilde ranges pull in a bad patch"
  - "Install a malicious update that still looks like a bugfix"
  - "Detect the update with scanner output and capture data"
mitigation:
  - "Pin exact versions on sensitive dependencies; avoid carets where compromise would hurt"
  - "Commit lockfiles and use npm ci in CI/CD"
  - "Require changelog and diff review before merging dependency bumps"
  - "Full blue-team runbook: DETECT.md in this lab folder"
drill:
  prompt: "A bot opened a dependency-bump PR while you were out. The whole diff is below. Approve it?"
  artifactType: diff
  artifact:
    - "diff --git a/package.json b/package.json"
    - "@@ -14,7 +14,7 @@"
    - "     \"leftpad-utils\": \"^2.1.0\","
    - "-    \"format-lite\": \"1.3.0\""
    - "+    \"format-lite\": \"1.4.0\""
    - "   }"
    - ""
    - "diff --git a/package-lock.json b/package-lock.json"
    - "@@ -311,6 +311,7 @@"
    - "     \"format-lite\": {"
    - "-      \"version\": \"1.3.0\","
    - "+      \"version\": \"1.4.0\","
    - "+      \"hasInstallScript\": true,"
    - "       \"integrity\": \"sha512-9f2c...\""
    - "     }"
  choices:
    - "Approve - it is a patch-level bump"
    - "Block it - why does a formatter suddenly need an install script"
  answer: 1
  reveal: "The version bump was camouflage. The real change is one line in the lockfile: hasInstallScript. The 1.4.0 release of a library you already trusted now runs code at install time, which is exactly how the coa, rc, and ua-parser-js hijacks shipped miners and stealers to thousands of projects."
  explanation: "A familiar name plus a small bump feels safe, and that feeling is the vulnerability. The only new capability in this diff is install-time execution, and no string-formatting library needs it. When a dependency update adds an install script out of nowhere, that is the attack surface announcing itself. Pin what matters and read the lockfile diff, not just package.json."
steps:
  - id: setup
    registry: setup
    audience: both
    title: Prepare legitimate and malicious update trees
    teaching: "Setup creates legitimate utils-helper, the malicious 2.1.1-style update, victim-app, and the mock collector scaffolding."
    hint: "Open both package trees and note how little the public API changed between versions."
    verify: { type: exit-zero }
  - id: services
    registry: services
    audience: both
    title: Start the mock collector
    teaching: "The update posts exfil to localhost:3000 when the victim loads the bad package under TESTBENCH_MODE."
    hint: "Leave the collector running for install and start."
    verify: { type: service-listening }
  - id: install
    registry: install
    audience: attack
    title: Install the malicious update
    teaching: "The lab models an automatic update by installing the malicious utils-helper from a local path. In the wild, a loose version range would have pulled this patch from a registry."
    hint: "Watch for postinstall or first-load hooks in the live terminal."
    verify: { type: exit-zero }
  - id: run
    registry: run
    audience: attack
    title: Run the victim after the update
    teaching: "The app still works. The malicious update hides exfil behind normal helper functions."
    hint: "Confirm at least one capture entry before you move to detection."
    verify: { type: capture-count, min: 1 }
  - id: detect
    registry: null
    audience: detect
    title: Review the update trail
    teaching: "Inspector data plus detection-tools/update-scanner.js show what changed. Pin versions and review diffs before you trust an update in production."
    hint: "From the scenario root: node detection-tools/update-scanner.js victim-app"
    verify: { type: capture-count, min: 1 }
quiz:
  - question: "What is the strongest IOC that a dependency update is malicious?"
    choices:
      - "The update bumps the minor version number"
      - "The update adds install or runtime script behavior the package never had"
      - "The update was published outside business hours"
    answer: 1
    explain: "A version number changing is the definition of an update, so it cannot be a signal. New install-time execution in a package that never had it, like hasInstallScript appearing in the lockfile diff, is the attack surface announcing itself."
  - question: "Which pattern should your detection stack alert on for this attack?"
    choices:
      - "CPU usage spikes on developer laptops"
      - "The star count on the package repository"
      - "A dependency update closely followed by new outbound connections or script execution"
    answer: 2
    explain: "The temporal pattern is the hunt: an update lands, then egress or postinstall execution appears right behind it. Stars and laptop CPU never enter the picture."
  - question: "Which control would have kept the malicious update out of your build?"
    choices:
      - "Pinning exact versions and dropping caret ranges on sensitive dependencies"
      - "Updating everything daily so you always run the latest code"
      - "Renaming package.json so bots cannot find it"
    answer: 0
    explain: "A caret range is standing permission to install whatever patch ships next. Pinning plus a committed lockfile means a bad update only arrives through a reviewed PR, not an automatic pull. Daily updates increase exposure; they do not reduce it."
