id: "22"
etaMinutes: 45
category: package-compromise
incidents:
  - "LiteLLM-style PyPI compromises"
  - "Python package supply chain"
caseStudy: "Models LiteLLM-style PyPI compromises: a Python package or site-packages hook (for example a rogue .pth) runs attacker code inside the virtualenv after a normal pip install."
objectives:
  - "Use the Python mock server and venv"
  - "pip install a compromised local package"
  - "Detect Python-side exfil patterns"
mitigation:
  - "Contain compromised virtualenvs; uninstall and recreate .venv from known-good pins"
  - "Enforce hash pinning or vetted indexes; rotate PyPI and API tokens after incidents"
  - "Scan site-packages for unexpected *.pth files after every pip install in CI"
  - "Full blue-team runbook: DETECT.md in this lab folder"
steps:
  - id: setup
    registry: setup
    audience: both
    title: Prepare venv and packages
    teaching: "Setup creates victim-app/.venv with clean litellm_like 1.82.6. On Debian hosts without python3-venv it bootstraps pip via get-pip.py."
    hint: "If setup still fails: sudo apt install python3-venv python3-pip (use the version apt suggests, e.g. python3.14-venv)."
    verify: { type: exit-zero }
  - id: services
    registry: services
    audience: both
    title: Start Python mock server
    teaching: "mock_server.py is stdlib-only and runs with system python3 on port 3022."
    verify: { type: service-listening }
  - id: install
    registry: install
    audience: attack
    title: pip install compromised 1.82.7
    teaching: "Upgrades the venv to python-packages/v1_82_7. Import-time code posts to localhost when TESTBENCH_MODE is enabled."
    hint: "Requires Prepare the lab to have created victim-app/.venv."
    verify: { type: exit-zero }
  - id: run
    registry: run
    audience: attack
    title: Run the Python victim app
    teaching: "run_victim.py imports litellm_like and should produce a capture on :3022."
    hint: "Keep the mock server running before this step."
    verify: { type: capture-count, min: 1 }
  - id: detect
    registry: null
    audience: detect
    title: Review PyPI IOCs
    teaching: "DETECT.md covers hash pins, index URL hardening, and venv isolation for Python labs."
    verify: { type: capture-count, min: 1 }
quiz:
  - question: "What is the strongest IOC of the litellm_like compromise in this lab?"
    choices:
      - "An unexpected .pth file, zzz_testbench_litellm_like.pth, sitting in site-packages"
      - "A requirements.txt entry pinned to an exact version"
      - "A virtualenv created with python3 -m venv"
    answer: 0
    explain: "Pinned requirements and fresh venvs are hygiene, not indicators. A .pth file nobody added is the IOC because Python executes it at every interpreter startup, which is how the hook runs without ever being imported."
  - question: "Which hunting behavior actually catches a .pth startup hook?"
    choices:
      - "Alerting only when application code explicitly imports litellm_like"
      - "Reading the package readme on PyPI"
      - "Watching for Python processes with network activity and no matching import, plus scanning site-packages for .pth drift after every pip install"
    answer: 2
    explain: "The hook fires at interpreter startup, so import tracing never sees it, and the readme is attacker-written marketing. A Python process beaconing to 127.0.0.1:3022 with no import to explain it, or a new .pth appearing in site-packages, is the catch."
  - question: "Which mitigation stops a tampered litellm_like artifact from installing in the first place?"
    choices:
      - "Upgrading to the newest release as soon as it publishes"
      - "Installing with --require-hashes from pip-compile output and scanning site-packages for rogue .pth files in CI"
      - "Trusting PyPI to delist malicious packages quickly"
    answer: 1
    explain: "Chasing the newest release is what pulled in 1.82.7, and delisting only happens after someone gets burned. Hash pinning makes a swapped artifact fail the install outright, and the .pth scan catches anything that still lands."
