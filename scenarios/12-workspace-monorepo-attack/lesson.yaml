id: "12"
etaMinutes: 40
category: package-compromise
incidents:
  - "Workspace package substitution"
  - "Monorepo trust boundaries"
caseStudy: "Models workspace package substitution in monorepos: a local package name wins resolution inside the workspace graph, so a malicious sibling package can shadow a trusted dependency."
objectives:
  - "Install across workspace packages safely vs maliciously"
  - "See how one bad workspace package infects the victim app"
  - "Review workspace lock and publish controls"
mitigation:
  - "CODEOWNERS on workspace packages and root task configs (nx.json / turbo.json)"
  - "Review cross-package task graphs before adding new workspace deps"
  - "Use --ignore-scripts in CI and allowlist required lifecycle scripts"
  - "Full blue-team runbook: DETECT.md in this lab folder"
steps:
  - id: setup
    registry: setup
    audience: both
    title: Prepare the monorepo
    teaching: "Setup wires root workspace, packages/api, packages/utils, and the victim app that consumes them."
    verify: { type: exit-zero }
  - id: services
    registry: services
    audience: both
    title: Start the mock collector
    teaching: "Compromised workspace code posts to localhost:3000 under TESTBENCH_MODE."
    verify: { type: service-listening }
  - id: install-root
    registry: install-root
    audience: attack
    title: Install workspace root
    teaching: "Root install links the workspace graph. Later package installs refine what the victim resolves."
    verify: { type: exit-zero }
  - id: install-api
    registry: install-api
    audience: attack
    title: Install api package
    teaching: "Install packages/api as part of the monorepo attack path."
    verify: { type: exit-zero }
  - id: install-utils
    registry: install-utils
    audience: attack
    title: Install utils package
    teaching: "Install the legitimate @devcorp/utils first so you can see the clean workspace state."
    verify: { type: exit-zero }
  - id: swap
    registry: swap
    audience: attack
    title: Swap compromised @devcorp/utils
    teaching: "This replaces packages/utils with the attacker copy and reinstalls. The malicious postinstall posts workspace metadata to the mock collector."
    hint: "Keep mock :3000 running. After this step the Live Inspector should show attackType workspace-monorepo."
    verify: { type: capture-count, min: 1 }
  - id: run
    registry: run
    audience: attack
    title: Run the victim app
    teaching: "victim-app still loads @devcorp/api and @devcorp/auth, which resolve the compromised workspace utils. The capture already landed on swap."
    hint: "If the inspector is empty, re-run Swap compromised @devcorp/utils with the mock server up."
    verify: { type: exit-zero }
  - id: detect
    registry: null
    audience: detect
    title: Review workspace trust
    teaching: "Treat internal packages like third-party deps. DETECT.md lists review gates for workspace publishes."
    verify: { type: capture-count, min: 1 }
