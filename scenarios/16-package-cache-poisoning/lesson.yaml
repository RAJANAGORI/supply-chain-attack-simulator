id: "16"
etaMinutes: 40
category: package-registry
incidents:
  - "npm cache poisoning"
  - "Reused poisoned cache entries"
caseStudy: "Models npm (and peer toolchain) cache poisoning: a bad tarball survives in ~/.npm or CI caches and is reused across clean-looking installs."
objectives:
  - "Poison the local cache on first install"
  - "Reuse the poison on a second install"
  - "Clear and verify caches as defense"
mitigation:
  - "Bind CI cache keys to lockfile hashes and revalidate integrity on restore"
  - "Clear caches after registry incidents; prefer npm ci with immutable mirrors"
  - "Monitor cache directories for unauthorized mutations"
  - "Full blue-team runbook: DETECT.md in this lab folder"
steps:
  - id: setup
    registry: setup
    audience: both
    title: Prepare the cache lab
    teaching: "Setup creates the victim app and scaffolding for demonstrating a poisoned package cache."
    verify: { type: exit-zero }
  - id: services
    registry: services
    audience: both
    title: Start the mock collector
    teaching: "Poisoned packages phone home to localhost:3016."
    verify: { type: service-listening }
  - id: install1
    registry: install1
    audience: attack
    title: First install poisons the cache
    teaching: "The first npm install seeds a malicious cache entry that later installs can reuse."
    verify: { type: exit-zero }
  - id: install2
    registry: install2
    audience: attack
    title: Second install reuses the poison
    teaching: "A second install pulls from the poisoned cache path, showing persistence beyond the first tree."
    verify: { type: exit-zero }
  - id: run
    registry: run
    audience: attack
    title: Run the victim app
    teaching: "Runtime confirms the poisoned package is active and the collector has data."
    verify: { type: capture-count, min: 1 }
  - id: detect
    registry: null
    audience: detect
    title: Clear and audit caches
    teaching: "DETECT.md covers npm cache verify/clean and CI cache isolation."
    verify: { type: capture-count, min: 1 }
quiz:
  - question: "What is the strongest IOC of package cache poisoning in this lab?"
    choices:
      - "The compromise returns after node_modules is deleted and reinstalled"
      - "npm install takes longer than usual"
      - "The package pulls in many transitive dependencies"
    answer: 0
    explain: "Slow installs and deep trees are normal. Reinfection after a clean reinstall is the signature: the poison lives outside node_modules, in the cache, so deleting the tree never removes it."
  - question: "When a reinstall stays compromised, which artifact should investigators check first?"
    choices:
      - "The package README and description fields"
      - "The app's environment variables"
      - "Cache paths like ~/.npm/_cacache, the pnpm store, or the CI cache restore"
    answer: 2
    explain: "The attack persists in the cache layer, so that is where the evidence lives, including tarballs with mismatched integrity in remote caches like Artifactory. Package metadata tells you nothing about where the bytes actually came from."
  - question: "Which response actually clears this attack out of a pipeline?"
    choices:
      - "Re-running npm install until the output looks clean"
      - "Purging npm, pnpm, Yarn, and CI caches, then binding cache keys to lockfile hashes"
      - "Restarting the CI runner"
    answer: 1
    explain: "Reinstalling or rebooting reuses the same poisoned cache. Incident response has to invalidate the cache itself, then re-key CI caches to lockfile hashes so restored entries match the reviewed lockfile."
